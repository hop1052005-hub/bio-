<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hợp Phạm | Profile</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: url('https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
    color: white;
}

.overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 100%);
    z-index: 1;
}

/* --- TÙY CHỈNH ÂM LƯỢNG --- */
.sound-wrap {
    position: fixed;
    top: 25px;
    left: 25px;
    z-index: 999;
    display: flex;
    align-items: center;
    background: rgba(15, 15, 15, 0.45);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 30px;
    padding: 5px;
    width: 50px;
    height: 50px;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

.sound-wrap:hover {
    width: 200px;
    background: rgba(15, 15, 15, 0.7);
    border-color: rgba(255, 120, 180, 0.4);
}

.sound-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 18px;
    color: white;
    cursor: pointer;
    flex-shrink: 0;
}

.sound-panel {
    flex: 1;
    padding: 0 15px 0 10px;
    opacity: 0;
    transition: opacity 0.3s ease;
    display: flex;
    align-items: center;
}

.sound-wrap:hover .sound-panel {
    opacity: 1;
    transition-delay: 0.1s;
}

#volumeSlider {
    width: 100%;
    appearance: none;
    height: 4px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 4px;
    outline: none;
    cursor: pointer;
}

#volumeSlider::-webkit-slider-thumb {
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    transition: transform 0.2s;
}

#volumeSlider::-webkit-slider-thumb:hover {
    transform: scale(1.3);
}

/* --- WRAP CHÍNH VÀ HIỆU ỨNG XUẤT HIỆN --- */
.wrap {
    display: flex;
    flex-direction: column;
    gap: 20px;
    z-index: 2;
    width: 100%;
    opacity: 0;
    transform: scale(0.9) translateY(20px);
    transition: all 1s cubic-bezier(0.2, 0.8, 0.2, 1);
    pointer-events: none;
}

.wrap.active {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: all;
}

/* --- KHUNG PROFILE (DARK GLASS) --- */
.card {
    width: 95%;
    max-width: 800px; 
    margin: auto;
    padding: 40px 30px;
    border-radius: 24px;
    background: rgba(15, 15, 15, 0.45);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    text-align: center;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.02);
}

/* Avatar phát sáng */
.avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #fff;
    margin-bottom: 12px;
    box-shadow: 0 0 20px rgba(255, 120, 180, 0.5);
    animation: glowPulse 2.5s infinite;
}

@keyframes glowPulse {
    0% { box-shadow: 0 0 15px rgba(255, 120, 180, 0.4); }
    50% { box-shadow: 0 0 30px rgba(255, 120, 180, 0.8), 0 0 10px rgba(255, 255, 255, 0.5); }
    100% { box-shadow: 0 0 15px rgba(255, 120, 180, 0.4); }
}

h1 {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
}

/* Badges */
.badges {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 12px;
}

.badges i {
    font-size: 16px;
    color: #ffd700;
    background: rgba(255, 255, 255, 0.1);
    padding: 6px;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    cursor: pointer;
    transition: 0.3s;
}

.badges i.fa-check-circle {
    color: #00d2ff;
    box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
}

.badges i:hover {
    transform: translateY(-3px) scale(1.1);
}

.bio, .location {
    font-size: 16px;
    margin-bottom: 8px;
    font-weight: 400;
    color: #ddd;
}

.socials {
    margin-top: 20px;
}

.socials a {
    font-size: 30px;
    margin: 0 14px;
    color: #fff;
    display: inline-block;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    opacity: 0.8;
}

.socials a:hover {
    opacity: 1;
    transform: translateY(-8px) scale(1.2);
    filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.8));
}

.views {
    margin-top: 30px;
    text-align: left;
    font-size: 15px;
    font-weight: 600;
    color: #bbb;
    display: flex;
    align-items: center;
    gap: 8px;
}

.views i {
    color: rgba(255, 120, 180, 0.8);
}

/* --- PLAYER NHẠC --- */
.player {
    width: 95%;
    max-width: 800px;
    margin: auto;
    padding: 20px 24px;
    border-radius: 20px;
    background: rgba(15, 15, 15, 0.45);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    gap: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

.cd-disc {
    font-size: 40px;
    color: #fff;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
}

.cd-disc.spin {
    animation: spinCD 4s linear infinite;
}

@keyframes spinCD {
    100% { transform: rotate(360deg); }
}

.songinfo {
    flex: 1;
    text-align: left;
}

.songtitle {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
}

.time {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
    font-size: 13px;
    color: #ccc;
}

.bar {
    flex: 1;
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    overflow: hidden;
    position: relative;
}

.progress {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff78b4, #ffb4d2);
    border-radius: 20px;
    box-shadow: 0 0 10px rgba(255, 120, 180, 0.5);
    transition: width 0.1s linear;
}

.controls {
    font-size: 24px;
    cursor: pointer;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    display: flex;
    justify-content: center;
    align-items: center;
    transition: 0.3s;
}

.controls:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(1.1);
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
}

/* --- MÀN HÌNH CLICK TO ENTER --- */
.enter {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0, 0, 0, 0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: 4px;
    color: white;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: opacity 0.8s ease, visibility 0.8s;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
}

.enter span {
    animation: pulseText 1.5s infinite;
}

@keyframes pulseText {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.98); text-shadow: 0 0 40px rgba(255, 255, 255, 0.8); }
}

/* --- TOAST THÔNG BÁO --- */
.toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    padding: 12px 28px;
    border-radius: 30px;
    background: rgba(0, 0, 0, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: white;
    font-weight: 500;
    font-size: 14px;
    opacity: 0;
    transition: .4s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 9999;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* --- TUYẾT CHIỀU SÂU --- */
.snow {
    position: fixed;
    top: -10px;
    color: white;
    pointer-events: none;
    z-index: 0;
}

@keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); }
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="sound-wrap">
    <div class="sound-btn">
        <i id="volIcon" class="fa-solid fa-volume-high"></i>
    </div>
    <div class="sound-panel">
        <input type="range" min="0" max="100" value="100" oninput="changeVolume(this.value)" id="volumeSlider">
    </div>
</div>

<div class="wrap" id="mainWrap">

    <div class="card">
        <img class="avatar" src="hop.PNG" alt="Avatar">
        
        <h1>Hợp Phạm</h1>
        
        <div class="badges">
            <i class="fa-solid fa-crown" title="Premium"></i>
            <i class="fa-solid fa-check-circle" title="Verified"></i>
        </div>

        <div class="bio">"Welcome to my profile"</div>
        <div class="location">📍 Hà Nam</div>

        <div class="socials">
            <a href="https://www.facebook.com/hop1052005" target="_blank"><i class="fab fa-facebook"></i></a>
            <a href="https://www.instagram.com/h0p_ph4m" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@hoppham2005" target="_blank"><i class="fab fa-tiktok"></i></a>
            <a href="javascript:void(0)" onclick="copyDiscord()"><i class="fab fa-discord"></i></a>
        </div>

        <div class="views"><i class="fa-solid fa-eye"></i> <span id="views"></span> lượt xem</div>
    </div>

    <div class="player">
        <div class="cd-disc" id="cdIcon">
            <i class="fa-solid fa-compact-disc"></i>
        </div>
        <div class="songinfo">
            <div class="songtitle">Khó Gần Dễ Xa</div>
            <div class="time">
                <span id="current">0:00</span>
                <div class="bar">
                    <div class="progress" id="progress"></div>
                </div>
                <span id="duration">0:00</span>
            </div>
        </div>
        <div class="controls" onclick="toggleMusic()">
            <i id="playBtn" class="fa-solid fa-play"></i>
        </div>
    </div>

</div>

<div class="enter" onclick="enterSite()" id="enterBox">
    <span>[ CLICK TO ENTER ]</span>
</div>

<div class="toast" id="toast"><i class="fa-brands fa-discord"></i> Đã sao chép Discord ID!</div>

<audio id="music" preload="auto" loop>
    <source src="khogandexa.mp3" type="audio/mpeg">
</audio>

<script>
    const music = document.getElementById("music");
    const enter = document.getElementById("enterBox");
    const wrap = document.getElementById("mainWrap");
    const playBtn = document.getElementById("playBtn");
    const cdIcon = document.getElementById("cdIcon");
    const volIcon = document.getElementById("volIcon");
    const progress = document.getElementById("progress");

    // Lượt xem ảo
    let v = localStorage.getItem("hopview");
    if(!v){ v = 0; }
    v++;
    localStorage.setItem("hopview", v);
    document.getElementById("views").innerText = v;

    // Hiệu ứng Enter Site
    function enterSite(){
        enter.style.opacity = "0";
        enter.style.visibility = "hidden";
        
        // Kích hoạt animation xuất hiện
        setTimeout(() => {
            wrap.classList.add("active");
        }, 100);

        // Tự động phát nhạc
        music.play();
        playBtn.className = "fa-solid fa-pause";
        cdIcon.classList.add("spin");
    }

    // Nút Play/Pause
    function toggleMusic(){
        if(music.paused){
            music.play();
            playBtn.className = "fa-solid fa-pause";
            cdIcon.classList.add("spin");
        }else{
            music.pause();
            playBtn.className = "fa-solid fa-play";
            cdIcon.classList.remove("spin");
        }
    }

    // Chỉnh âm lượng
    function changeVolume(val){
        music.volume = val / 100;
        if(val == 0){
            volIcon.className = "fa-solid fa-volume-xmark";
        }else if(val < 50){
            volIcon.className = "fa-solid fa-volume-low";
        }else{
            volIcon.className = "fa-solid fa-volume-high";
        }
    }

    // Copy Discord ID
    function copyDiscord(){
        navigator.clipboard.writeText("hoppham_76617");
        let toast = document.getElementById("toast");
        toast.classList.add("show");
        setTimeout(()=>{
            toast.classList.remove("show");
        }, 2000);
    }

    // Cập nhật thanh thời gian nhạc
    music.addEventListener("timeupdate", ()=>{
        if(music.duration){
            let per = (music.currentTime / music.duration) * 100;
            progress.style.width = per + "%";
            document.getElementById("current").innerText = time(music.currentTime);
            document.getElementById("duration").innerText = time(music.duration);
        }
    });

    function time(s){
        if (isNaN(s)) return "0:00";
        let m = Math.floor(s / 60);
        let sec = Math.floor(s % 60);
        if(sec < 10) sec = "0" + sec;
        return m + ":" + sec;
    }

    // Hiệu ứng tuyết rơi (Có thêm blur ngẫu nhiên để tạo chiều sâu)
    for(let i = 0; i < 35; i++){
        let snow = document.createElement("div");
        snow.className = "snow";
        snow.innerHTML = "❄";
        snow.style.left = Math.random() * 100 + "vw";
        
        let size = (8 + Math.random() * 14);
        snow.style.fontSize = size + "px";
        
        // Tạo hiệu ứng xa gần bằng độ mờ (blur)
        if(Math.random() > 0.5) {
            snow.style.filter = "blur(2px)";
            snow.style.opacity = "0.4";
        } else {
            snow.style.opacity = (0.6 + Math.random() * 0.4).toString();
        }

        snow.style.animation = `fall ${4 + Math.random() * 6}s linear infinite`;
        snow.style.animationDelay = `-${Math.random() * 5}s`;
        document.body.appendChild(snow);
    }
</script>

</body>
</html>
